name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        # Use `npm install` to allow installing new dependencies when package-lock.json is out of sync.
        run: npm install --no-audit --no-fund

      - name: Inject Adsense snippet (optional)
        if: env.REACT_APP_ADSENSE_ID != ''
        run: |
          echo "Injecting Adsense ID into public/index.html"
          # Create a script tag with the publisher id and replace the placeholder
          ADSENSE_SNIPPET="<script async src=\"https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=${REACT_APP_ADSENSE_ID}\" crossorigin=\"anonymous\"></script>\n<script> (adsbygoogle = window.adsbygoogle || []).push({}); </script>"
          # Use perl to safely do an in-file replace
          perl -0777 -pe "s/<!-- ADSENSE_SNIPPET_PLACEHOLDER -->.*?<!-- End ADSENSE_SNIPPET_PLACEHOLDER -->/${ADSENSE_SNIPPET}/s" -i public/index.html
        env:
          REACT_APP_ADSENSE_ID: ${{ secrets.REACT_APP_ADSENSE_ID }}

      - name: Build
        run: npm run build
        env:
          REACT_APP_ADSENSE_ID: ${{ secrets.REACT_APP_ADSENSE_ID }}

      - name: Copy CNAME
        run: |
          if [ -f CNAME ]; then
            cp CNAME build/CNAME
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
