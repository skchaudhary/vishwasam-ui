name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install dependencies
        # Use `npm install` to allow installing new dependencies when package-lock.json is out of sync.
        run: npm install --no-audit --no-fund

      - name: Inject Adsense snippet (optional)
        if: ${{ secrets.REACT_APP_ADSENSE_ID != '' }}
        env:
          REACT_APP_ADSENSE_ID: ${{ secrets.REACT_APP_ADSENSE_ID }}
        run: |
          echo "Injecting Adsense ID into public/index.html"

          ADSENSE_SNIPPET=$(cat <<EOF
          <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=${REACT_APP_ADSENSE_ID}" crossorigin="anonymous"></script>
          <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
          EOF
          )

          export ADSENSE_SNIPPET

          perl -0777 -i -pe 'BEGIN { $s = $ENV{"ADSENSE_SNIPPET"} // "" } s/<!-- ADSENSE_SNIPPET_PLACEHOLDER -->.*?<!-- End ADSENSE_SNIPPET_PLACEHOLDER -->/$s/si' public/index.html

      - name: Build
        run: npm run build
        env:
          REACT_APP_ADSENSE_ID: ${{ secrets.REACT_APP_ADSENSE_ID }}

      - name: Copy CNAME
        run: |
          if [ -f CNAME ]; then
            cp CNAME build/CNAME
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
